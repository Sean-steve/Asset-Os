name: Asset OS B2.1 Controlled Full-Stack Staging
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-to-postgres-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asset_os
          POSTGRES_USER: asset_os_owner
          POSTGRES_PASSWORD: ci-only-owner-password
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U asset_os_owner -d asset_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      NODE_ENV: test
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      ASSET_OS_FULLSTACK_STAGE: '1'
      DATABASE_URL: postgresql://asset_os_app:ci-only-app-password@127.0.0.1:5435/asset_os
      MIGRATION_DATABASE_URL: postgresql://asset_os_owner:ci-only-owner-password@127.0.0.1:5435/asset_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and backend dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix apps/api install --no-audit --no-fund
      - name: Provision restricted PostgreSQL role
        env:
          PGPASSWORD: ci-only-owner-password
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -p 5435 -U asset_os_owner -d asset_os \
            -v role_password=ci-only-app-password -f infra/scripts/create-runtime-role.sql
      - name: Apply five migrations and verify checksums
        run: |
          npm --prefix apps/api run migrate
          npm --prefix apps/api run migrate:check
      - name: Create CI-only public OAuth config in preview artifact
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync('public/asset-runtime.json',JSON.stringify({
            apiBaseUrl:'http://127.0.0.1:3001',
            issuer:'http://127.0.0.1:4300/realm',
            authorizationEndpoint:'http://127.0.0.1:4300/oauth/authorize',
            tokenEndpoint:'http://127.0.0.1:4300/oauth/token',
            clientId:'asset-os-stage-public',
            audience:'asset-os-api'
          }))
          NODE
      - name: Compile production-mode frontend and real API
        run: NODE_ENV=production npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start ephemeral RS256 OIDC and real Fastify / PostgreSQL
        run: |
          nohup node apps/api/test/controlled-staging.mjs > /tmp/asset-os-controlled-stage.log 2>&1 &
          echo $! > /tmp/asset-os-controlled-stage.pid
          for count in $(seq 1 50); do
            if test -s /tmp/asset-os-stage-tenant.json && curl -fsS http://127.0.0.1:3001/health/ready > /tmp/asset-os-ready.json; then
              echo "Controlled B2.1 stage is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Controlled stage failed to become ready."
          tail -n 60 /tmp/asset-os-controlled-stage.log
          exit 1
      - name: Certify browser → PKCE issuer → API → real PostgreSQL
        run: npx playwright test e2e/controlled-staging.spec.mjs --project=desktop-chromium --project=mobile-chromium
      - name: Upload controlled staging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-os-b21-staging-failure
          path: |
            playwright-report/
            test-results/
            /tmp/asset-os-controlled-stage.log
          retention-days: 7
      - name: Stop ephemeral staging services
        if: always()
        run: |
          if test -s /tmp/asset-os-controlled-stage.pid; then
            kill "$(cat /tmp/asset-os-controlled-stage.pid)" || true
          fi
