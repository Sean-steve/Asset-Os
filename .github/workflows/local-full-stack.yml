name: Asset OS Local Full-Stack Integration Certification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-ubuntu-equivalent-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asset_os
          POSTGRES_USER: asset_os_owner
          POSTGRES_PASSWORD: ci-only-owner-password
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U asset_os_owner -d asset_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASSET_OS_E2E_PASSWORD: ci-local-owner-password-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and isolated API dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix apps/api install --no-audit --no-fund
          npm --prefix apps/api run build
      - name: Provision restricted database and migrations
        env:
          PGPASSWORD: ci-only-owner-password
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -p 5435 -U asset_os_owner -d asset_os -v role_password=ci-only-app-password -f infra/scripts/create-runtime-role.sql
          mkdir -p .local
          chmod 700 .local
          cat > .local/asset-os.env <<'EOF'
          NODE_ENV=development
          HOST=127.0.0.1
          PORT=3001
          DATABASE_URL=postgresql://asset_os_app:ci-only-app-password@127.0.0.1:5435/asset_os
          MIGRATION_DATABASE_URL=postgresql://asset_os_owner:ci-only-owner-password@127.0.0.1:5435/asset_os
          OIDC_ISSUER=http://127.0.0.1:3003
          OIDC_AUDIENCE=asset-os-api
          OIDC_JWKS_URL=http://127.0.0.1:3003/jwks
          ASSET_OS_ALLOW_LOCAL_OIDC=yes
          LOCAL_IDP_ENABLED=yes
          LOCAL_IDP_PASSWORD=ci-local-owner-password-not-production
          LOCAL_IDP_ADMIN_SECRET=ci-local-admin-secret-for-isolated-test-only-987654
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
          ASSET_OS_LOCAL_MODE=yes
          EOF
          chmod 600 .local/asset-os.env
          node --env-file=.local/asset-os.env apps/api/dist/migrate.js
          node --env-file=.local/asset-os.env apps/api/dist/migrate.js --check
      - name: Start local OIDC, bootstrap issuer-verified owner, API and Vite
        run: |
          npm run local:dev > /tmp/asset-os-local-dev.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3001/health/ready >/dev/null 2>&1 && curl -fsS http://127.0.0.1:5173/Asset-Os/ >/dev/null 2>&1 && test -s .local/tenant-id; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3001/health/ready
          curl --fail http://127.0.0.1:3003/.well-known/openid-configuration
          test -s .local/tenant-id
      - name: Install Chromium browser
        run: npx playwright install chromium --with-deps
      - name: Certify real local browser workflows against OIDC and PostgreSQL
        run: npx playwright test --config=playwright.local.config.mjs
      - name: Print redacted startup logs on failure
        if: failure()
        run: |
          if [ -f /tmp/asset-os-local-dev.log ]; then
            sed -E 's/(password|token|secret)=[^ ]+/<REDACTED>/Ig' /tmp/asset-os-local-dev.log | tail -70
          fi
